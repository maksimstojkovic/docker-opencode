name: build

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'root/**'
      - 'scripts/**'
      - '.opencode-version'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'Opencode version to build (omit to use .opencode-version)'
        required: false
        type: string
      push:
        description: 'Push to ghcr.io after build'
        required: false
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve opencode version
        id: version
        run: |
          if [ -n "${{ inputs.opencode_version }}" ]; then
            v="${{ inputs.opencode_version }}"
          else
            v="$(tr -d '[:space:]' < .opencode-version)"
          fi
          echo "opencode_version=${v}" >> "${GITHUB_OUTPUT}"
          echo "Building opencode v${v}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          v="${{ steps.version.outputs.opencode_version }}"
          repo="${REGISTRY}/${IMAGE_NAME}"
          # Lowercase the repo path — GHCR rejects uppercase.
          repo_lc="$(echo "${repo}" | tr '[:upper:]' '[:lower:]')"
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"

          # Validate the version looks like semver (major.minor.patch); skip
          # the minor-only tag if it doesn't, to avoid emitting nonsense like
          # ":1" from a malformed input.
          tags=()
          tags+=("${repo_lc}:${v}")
          if printf '%s' "${v}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            minor="${v%.*}"
            tags+=("${repo_lc}:${minor}")
          fi
          tags+=("${repo_lc}:latest")
          tags+=("${repo_lc}:sha-${short_sha}")

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            OPENCODE_VERSION=${{ steps.version.outputs.opencode_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summarise
        run: |
          echo "### Built opencode v${{ steps.version.outputs.opencode_version }}" >> "${GITHUB_STEP_SUMMARY}"
          echo '' >> "${GITHUB_STEP_SUMMARY}"
          echo 'Tags pushed:' >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          echo '${{ steps.tags.outputs.tags }}' >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
